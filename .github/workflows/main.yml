name: Build ZZScript

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Derle
        run: mvn -B clean package

      - name: Jar dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: ZZScript-jar
          path: target/ZZScript.jar
